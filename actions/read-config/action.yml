name: Read application configuration
description: Validates nextjs-app.yml and exposes app settings as action outputs.

inputs:
  config-path:
    description: Path to nextjs-app.yml inside the checked-out app.
    required: false
  aws-region:
    description: AWS region used when no config file is provided, or as an override.
    required: false
  command:
    description: Preview operation, either deploy or destroy.
    required: true

outputs:
  app-directory:
    description: Application directory relative to the repository root.
    value: ${{ steps.config.outputs.app-directory }}
  app-slug:
    description: Unique lowercase identifier for this application.
    value: ${{ steps.config.outputs.app-slug }}
  node-version:
    description: Node.js version used by the build.
    value: ${{ steps.config.outputs.node-version }}
  package-manager:
    description: Detected application package manager, npm or yarn.
    value: ${{ steps.config.outputs.package-manager }}
  cache-dependency-path:
    description: Application lockfile path, or empty to disable dependency caching.
    value: ${{ steps.config.outputs.cache-dependency-path }}
  install-command:
    description: Dependency installation command.
    value: ${{ steps.config.outputs.install-command }}
  lint-command:
    description: Lint command.
    value: ${{ steps.config.outputs.lint-command }}
  test-command:
    description: Optional test command.
    value: ${{ steps.config.outputs.test-command }}
  build-command:
    description: Optional Next.js build command.
    value: ${{ steps.config.outputs.build-command }}
  opennext-build-command:
    description: Optional override for the platform OpenNext build.
    value: ${{ steps.config.outputs.opennext-build-command }}
  smoke-test-command:
    description: Optional custom smoke test command. Empty disables the smoke test.
    value: ${{ steps.config.outputs.smoke-test-command }}
  aws-region:
    description: AWS region shared by preview and production.
    value: ${{ steps.config.outputs.aws-region }}
  deployment-type:
    description: Application hosting mode, static or ssr.
    value: ${{ steps.config.outputs.deployment-type }}

runs:
  using: composite
  steps:
    - id: config
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CONFIG_PATH: ${{ inputs.config-path }}
        AWS_REGION: ${{ inputs.aws-region }}
        COMMAND: ${{ inputs.command }}
      run: node "$ACTION_PATH/../run.mjs" "$ACTION_PATH/read-config.ts"