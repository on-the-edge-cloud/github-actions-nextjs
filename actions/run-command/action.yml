name: Run application command
description: "Runs a configured command in the application directory with strict Bash settings."
inputs:
  command:
    description: Shell command from the application configuration.
    required: true
  working-directory:
    description: Application directory relative to the caller checkout.
    default: .
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        RUN_COMMAND: ${{ inputs.command }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: node "$ACTION_PATH/../run.mjs" "$ACTION_PATH/run-command.ts"