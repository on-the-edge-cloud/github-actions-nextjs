name: Smoke test deployment
description: Run an optional custom deployment smoke test.

inputs:
  url:
    description: Deployed application URL.
    required: true
  command:
    description: Optional custom smoke test command. Empty disables the smoke test.
    default: ""
  working-directory:
    description: Application directory for the custom command.
    default: .
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BASE_URL: ${{ inputs.url }}
        SMOKE_TEST_COMMAND: ${{ inputs.command }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: node "$ACTION_PATH/../run.mjs" "$ACTION_PATH/smoke-test.ts"