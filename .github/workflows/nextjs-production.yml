name: Next.js production environment

on:
  workflow_call:
    inputs:
      config-path:
        description: Path to nextjs-app.yml in the caller repository.
        required: false
        type: string
      aws-region:
        description: AWS region for the application. Overrides the config file when both are provided.
        required: false
        type: string
    secrets:
      AWS_ROLE_ARN:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: false
    outputs:
      production-url:
        description: URL of the deployed production application.
        value: ${{ jobs.production.outputs.production-url }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  production:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    outputs:
      production-url: ${{ steps.production.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Checkout actions platform
        uses: actions/checkout@v4
        with:
          repository: on-the-edge-cloud/github-actions-nextjs
          ref: main
          path: .platform

      - name: Read application configuration
        id: config
        uses: ./.platform/actions/read-config
        with:
          config-path: ${{ inputs.config-path }}
          aws-region: ${{ inputs.aws-region }}
          command: deploy

      - name: Checkout Terraform module version
        uses: actions/checkout@v4
        with:
          repository: on-the-edge-cloud/terraform-aws-nextjs
          ref: v1.4.3
          path: .terraform-modules

      - name: Setup Node.js for Corepack
        if: steps.config.outputs.package-manager == 'yarn'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.config.outputs.node-version }}

      - name: Enable Corepack
        if: steps.config.outputs.package-manager == 'yarn'
        working-directory: ${{ steps.config.outputs.app-directory }}
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.config.outputs.node-version }}
          cache: ${{ steps.config.outputs.cache-dependency-path != '' && steps.config.outputs.package-manager || '' }}
          cache-dependency-path: ${{ steps.config.outputs.cache-dependency-path }}

      - name: Install dependencies
        uses: ./.platform/actions/run-command
        with:
          working-directory: ${{ steps.config.outputs.app-directory }}
          command: ${{ steps.config.outputs.install-command }}

      - name: Lint
        if: steps.config.outputs.lint-command != ''
        uses: ./.platform/actions/run-command
        with:
          working-directory: ${{ steps.config.outputs.app-directory }}
          command: ${{ steps.config.outputs.lint-command }}

      - name: Test application
        if: steps.config.outputs.test-command != ''
        uses: ./.platform/actions/run-command
        with:
          working-directory: ${{ steps.config.outputs.app-directory }}
          command: ${{ steps.config.outputs.test-command }}

      - name: Build Next.js
        if: steps.config.outputs.build-command != ''
        uses: ./.platform/actions/run-command
        with:
          working-directory: ${{ steps.config.outputs.app-directory }}
          command: ${{ steps.config.outputs.build-command }}

      - name: Build OpenNext
        if: steps.config.outputs.deployment-type == 'ssr'
        uses: ./.platform/actions/build-opennext
        with:
          working-directory: ${{ steps.config.outputs.app-directory }}
          command: ${{ steps.config.outputs.opennext-build-command }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ steps.config.outputs.aws-region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Prepare Terraform variables
        uses: ./.platform/actions/prepare-terraform
        with:
          app-directory: ${{ steps.config.outputs.app-directory }}
          app-slug: ${{ steps.config.outputs.app-slug }}
          deployment-type: ${{ steps.config.outputs.deployment-type }}
          aws-region: ${{ steps.config.outputs.aws-region }}
          domain: ${{ steps.config.outputs.domain }}

      - name: Format Terraform
        run: terraform -chdir="$TERRAFORM_ROOT" fmt -check -recursive

      - name: Initialize Terraform without backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform -chdir="$TERRAFORM_ROOT" init -backend=false -input=false

      - name: Validate Terraform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform -chdir="$TERRAFORM_ROOT" validate

      - name: Initialize Terraform backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: ./.platform/actions/terraform-backend

      - name: Plan production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform -chdir="$TERRAFORM_ROOT" plan -out="$RUNNER_TEMP/production.tfplan"

      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform -chdir="$TERRAFORM_ROOT" apply "$RUNNER_TEMP/production.tfplan"

      - name: Read production URL
        id: production
        uses: ./.platform/actions/deployment-outputs
        with:
          environment: production

      - name: Invalidate CloudFront
        uses: ./.platform/actions/invalidate-cloudfront
        with:
          distribution-id: ${{ steps.production.outputs.distribution-id }}

      - name: Smoke test production
        uses: ./.platform/actions/smoke-test
        with:
          url: ${{ steps.production.outputs.url }}
          command: ${{ steps.config.outputs.smoke-test-command }}
          working-directory: ${{ steps.config.outputs.app-directory }}

      - name: Announce production URL
        env:
          PRODUCTION_URL: ${{ steps.production.outputs.url }}
        run: |
          echo "::notice title=Production deployed::Production URL: ${PRODUCTION_URL}"