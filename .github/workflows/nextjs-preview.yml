name: Next.js preview environment

on:
  workflow_call:
    inputs:
      config-path:
        description: Path to nextjs-app.yml in the caller repository.
        required: true
        type: string
      command:
        description: "Operation to perform: deploy or destroy."
        required: true
        type: string
    secrets:
      AWS_ROLE_ARN:
        required: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: preview-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Checkout actions platform
        uses: actions/checkout@v4
        with:
          repository: on-the-edge-cloud/github-actions-nextjs
          ref: main
          path: .platform

      - name: Read application configuration
        id: config
        uses: ./.platform/actions/read-config
        with:
          config-path: ${{ inputs.config-path }}
          command: ${{ inputs.command }}

      - name: Checkout Terraform module version
        if: inputs.command == 'deploy' || inputs.command == 'destroy'
        uses: actions/checkout@v4
        with:
          repository: on-the-edge-cloud/terraform-aws-nextjs
          ref: v1.4
          path: .terraform-modules

      - name: Setup Node.js
        if: inputs.command == 'deploy'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.config.outputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ steps.config.outputs.app-directory }}/package-lock.json

      - name: Install dependencies
        if: inputs.command == 'deploy'
        uses: ./.platform/actions/run-command
        with:
          working-directory: ${{ steps.config.outputs.app-directory }}
          command: ${{ steps.config.outputs.install-command }}

      - name: Lint
        if: inputs.command == 'deploy' && steps.config.outputs.lint-command != ''
        uses: ./.platform/actions/run-command
        with:
          working-directory: ${{ steps.config.outputs.app-directory }}
          command: ${{ steps.config.outputs.lint-command }}

      - name: Test application
        if: inputs.command == 'deploy' && steps.config.outputs.test-command != ''
        uses: ./.platform/actions/run-command
        with:
          working-directory: ${{ steps.config.outputs.app-directory }}
          command: ${{ steps.config.outputs.test-command }}

      - name: Build Next.js
        if: inputs.command == 'deploy' && steps.config.outputs.build-command != ''
        uses: ./.platform/actions/run-command
        with:
          working-directory: ${{ steps.config.outputs.app-directory }}
          command: ${{ steps.config.outputs.build-command }}

      - name: Build OpenNext
        if: inputs.command == 'deploy'
        uses: ./.platform/actions/build-opennext
        with:
          working-directory: ${{ steps.config.outputs.app-directory }}
          command: ${{ steps.config.outputs.opennext-build-command }}

      - name: Configure AWS credentials
        if: inputs.command == 'deploy' || inputs.command == 'destroy'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ steps.config.outputs.aws-region }}

      - name: Setup Terraform
        if: inputs.command == 'deploy' || inputs.command == 'destroy'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Prepare Terraform variables
        if: inputs.command == 'deploy' || inputs.command == 'destroy'
        uses: ./.platform/actions/prepare-terraform
        with:
          app-directory: ${{ steps.config.outputs.app-directory }}
          app-slug: ${{ steps.config.outputs.app-slug }}
          deployment-type: ${{ steps.config.outputs.deployment-type }}
          aws-region: ${{ steps.config.outputs.aws-region }}
          pr-number: ${{ github.event.pull_request.number }}
          command: ${{ inputs.command }}

      - name: Format Terraform
        if: inputs.command == 'deploy' || inputs.command == 'destroy'
        run: terraform -chdir="$TERRAFORM_ROOT" fmt -check -recursive

      - name: Initialize Terraform without backend
        if: inputs.command == 'deploy' || inputs.command == 'destroy'
        run: terraform -chdir="$TERRAFORM_ROOT" init -backend=false -input=false

      - name: Validate Terraform
        if: inputs.command == 'deploy' || inputs.command == 'destroy'
        run: terraform -chdir="$TERRAFORM_ROOT" validate

      - name: Initialize Terraform backend
        if: inputs.command == 'deploy' || inputs.command == 'destroy'
        uses: ./.platform/actions/terraform-backend

      - name: Plan preview
        if: inputs.command == 'deploy'
        run: terraform -chdir="$TERRAFORM_ROOT" plan -out="$RUNNER_TEMP/preview.tfplan"

      - name: Deploy preview
        if: inputs.command == 'deploy'
        run: terraform -chdir="$TERRAFORM_ROOT" apply "$RUNNER_TEMP/preview.tfplan"

      - name: Read preview URL
        id: preview
        if: inputs.command == 'deploy'
        uses: ./.platform/actions/deployment-outputs
        with:
          environment: preview

      - name: Invalidate CloudFront
        if: inputs.command == 'deploy'
        uses: ./.platform/actions/invalidate-cloudfront
        with:
          distribution-id: ${{ steps.preview.outputs.distribution-id }}

      - name: Smoke test preview
        if: inputs.command == 'deploy'
        uses: ./.platform/actions/smoke-test
        with:
          url: ${{ steps.preview.outputs.url }}
          deployment-type: ${{ steps.config.outputs.deployment-type }}
          command: ${{ steps.config.outputs.smoke-test-command }}
          working-directory: ${{ steps.config.outputs.app-directory }}

      - name: Comment preview URL
        if: inputs.command == 'deploy'
        uses: ./.platform/actions/comment-preview
        with:
          url: ${{ steps.preview.outputs.url }}
          pr-number: ${{ github.event.pull_request.number }}

      - name: Destroy preview
        if: inputs.command == 'destroy'
        run: terraform -chdir="$TERRAFORM_ROOT" destroy -auto-approve -var="deploy_artifacts=false"